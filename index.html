<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Metrònom IAxd</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            text-align: center;
            padding: 10px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .control-group {
            width: 90%;
            text-align: left;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #555;
        }
        .control-group.fuerte-group { border-left-color: #ff3333; }
        .control-group.debil-group { border-left-color: #33ccff; }

        label { font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        select, input[type="number"] {
            padding: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        button {
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            width: 90%;
        }
        .btn-start { background: #2ecc71; color: white; }
        .btn-start.playing { background: #e74c3c; }
        #display {
            font-size: 2.2rem;
            margin: 15px 0;
            font-family: monospace;
            min-height: 50px;
        }
        .led {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #333;
            margin: 10px auto;
            transition: background 0.05s ease-out;
        }
        .led.active-fuerte { background: #ff3333; box-shadow: 0 0 15px #ff3333; }
        .led.active-debil { background: #33ccff; box-shadow: 0 0 15px #33ccff; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏱️ Metrònom IA Avançatxd</h1>

    <div id="led" class="led"></div>
    <div id="display">Aturat</div>

    <div class="controls">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; width: 90%;">
            <div style="flex: 1; min-width: 120px; text-align: left;">
                <label>Tempo (BPM)</label>
                <input type="number" id="bpm" value="120" min="40" max="300">
            </div>
            <div style="flex: 1; min-width: 160px; text-align: left;">
                <label>Compàs / Mode</label>
                <select id="compas" onchange="actualitzarSelectorsInici()">
                    <option value="4">Estàndard 4/4</option>
                    <option value="3">Vals 3/4</option>
                    <option value="5">Cinc Temps 5/4</option>
                    <option value="flamenco">💃 Flamenco (Amalgama 12t)</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 120px; text-align: left;">
                <label>Beat d'Inici</label>
                <select id="startBeat">
                    <!-- Es genera dinàmicament per JS -->
                </select>
            </div>
        </div>

        <button id="startBtn" class="btn-start" onclick="toggleMetronome()">INICIAR RITME</button>

        <h3 style="margin: 10px 0 0 0; color: #ffbc42;">🎛️ Pesos de la IA (Cadenes de Màrkov)</h3>

        <div class="control-group fuerte-group" id="fuerteSliders">
            <span style="color: #ff3333; font-weight: bold; font-size: 0.85rem;">Si l'últim beat ha estat GOLP FORT:</span>
            <div style="margin-top: 8px;">
                <label>Probabilitat de repetir un Fort: <span id="val_ff">10%</span></label>
                <input type="range" id="p_ff" min="0" max="100" value="10" oninput="ajustarPesos('F', 'ff')">
            </div>
            <div style="margin-top: 8px;">
                <label>Probabilitat de passar a feble: <span id="val_fd">80%</span></label>
                <input type="range" id="p_fd" min="0" max="100" value="80" readonly style="opacity:0.5; pointer-events:none;">
            </div>
            <div style="margin-top: 8px;">
                <label>Probabilitat de Silenci: <span id="val_fs">10%</span></label>
                <input type="range" id="p_fs" min="0" max="100" value="10" oninput="ajustarPesos('F', 'fs')">
            </div>
        </div>

        <div class="control-group debil-group">
            <span style="color: #33ccff; font-weight: bold; font-size: 0.85rem;">Si l'últim beat ha estat GOLP FEBLE:</span>
            <div style="margin-top: 8px;">
                <label>Probabilitat de saltar a un Fort (Síncopa): <span id="val_df">25%</span></label>
                <input type="range" id="p_df" min="0" max="100" value="25" oninput="ajustarPesos('d', 'df')">
            </div>
            <div style="margin-top: 8px;">
                <label>Probabilitat de repetir un Feble: <span id="val_dd">65%</span></label>
                <input type="range" id="p_dd" min="0" max="100" value="65" readonly style="opacity:0.5; pointer-events:none;">
            </div>
            <div style="margin-top: 8px;">
                <label>Probabilitat de Silenci: <span id="val_ds">10%</span></label>
                <input type="range" id="p_ds" min="0" max="100" value="10" oninput="ajustarPesos('d', 'ds')">
            </div>
        </div>
    </div>
</div>

<!-- Enllaç al fitxer de lògica independent -->
<script src="script.js"></script>
</body>
</html>
